<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>显示器输出管理</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --line:#2a333d;
    --text:#e6edf3; --dim:#8b98a5; --on:#3fb950; --off:#f0883e;
    --danger:#f85149; --accent:#58a6ff; --primary:#d2a8ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    font-size:13px;display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
  .meta{color:var(--dim);font-size:12px}
  .meta b{color:var(--text);font-weight:600}
  .spacer{flex:1}
  .conn{
    font-size:11.5px;padding:2px 9px;border-radius:10px;border:1px solid var(--line);
    color:var(--dim);white-space:nowrap;
  }
  .conn.ok{color:#7ee787;border-color:#2ea043;background:#12281a}
  .conn.bad{color:#ffb3ad;border-color:#8b2c2c;background:#2a1414}
  button{
    font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;
    transition:.15s;
  }
  button:hover:not(:disabled){background:#26303a;border-color:#3d4956}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#17351f;border-color:#2ea043;color:#7ee787}
  button.primary:hover:not(:disabled){background:#1d4427}
  button.danger{background:#3a1a1a;border-color:#8b2c2c;color:#ff9c96}
  button.danger:hover:not(:disabled){background:#4c1f1f}
  button.ghost{background:transparent}
  select{
    font:inherit;color:var(--text);background:#0d1117;border:1px solid var(--line);
    border-radius:5px;padding:4px 6px;cursor:pointer;
  }
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px;gap:10px}
  #canvasWrap{
    flex:1;min-height:220px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;position:relative;
  }
  #layout{width:100%;height:100%;display:block}
  .rbox{cursor:pointer}
  .rbox rect{transition:.15s}
  .rbox:hover rect.screen{filter:brightness(1.22)}
  #offTray{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{
    display:flex;align-items:center;gap:8px;background:var(--panel);border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;color:var(--dim);font-size:12px;
  }
  .chip.on-cur{border-color:var(--accent);color:var(--text)}
  .chip button{padding:3px 9px;font-size:12px}
  aside{
    width:330px;flex:0 0 330px;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .asideScroll{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .card{
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    cursor:pointer;
  }
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:500;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
  .badge.live{color:#7ee787;border-color:#2ea043;background:#12281a}
  .badge.dead{color:#ff9c96;border-color:#8b2c2c;background:#2a1414}
  .badge.info{color:var(--primary);border-color:#6e40c9;background:#1e1533}
  .badge.warn{color:#ffd28a;border-color:#9e6a03;background:#2b2007}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;color:var(--dim);font-size:12px}
  .kv span:nth-child(even){color:var(--text);font-variant-numeric:tabular-nums}
  .cardActions{display:flex;gap:8px;margin-top:9px}
  .cardActions button{flex:1;padding:5px 8px}
  .help{font-size:11.5px;color:var(--dim);line-height:1.65}
  /* 亮度滑杆 */
  .bright{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
  .brightHead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .brightHead b{margin-left:auto;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
  .btag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .btag.hw{color:#7ee787;border-color:#2ea043;background:#12281a}
  .btag.sw{color:#ffd28a;border-color:#9e6a03;background:#2b2007}
  .btag.no{color:#ff9c96;border-color:#8b2c2c;background:#2a1414}
  .slider{-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:5px 0 0;
    background:transparent;cursor:pointer;display:block}
  .slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#2b333d}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;
    border-radius:50%;background:#58a6ff;border:2px solid #0d1117}
  .slider::-moz-range-track{height:4px;border-radius:2px;background:#2b333d}
  .slider::-moz-range-progress{height:4px;border-radius:2px;background:#1f6feb}
  .slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#58a6ff;
    border:2px solid #0d1117}
  .slider:disabled{opacity:.45;cursor:not-allowed}
  .bnote{font-size:11px;color:var(--dim);line-height:1.55;margin-top:5px}
  /* 软件叠加层（只在硬件通道出现，硬件到 0 后才可用） */
  .bov{margin-top:7px;padding-top:6px;border-top:1px dotted var(--line)}
  .bov .brightHead{font-size:11.5px}
  .bovtag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
    color:var(--dim);font-variant-numeric:tabular-nums}
  /* 夜间色温（软件 gamma，跟亮度合成一次 xrandr 调用） */
  .btemp{margin-top:7px;padding-top:6px;border-top:1px dotted var(--line)}
  .btemp .brightHead{font-size:11.5px}
  .temptag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
    color:var(--dim);font-variant-numeric:tabular-nums}
  .temptag.warm{color:#ffd28a;border-color:#9e6a03;background:#2b2007}
  .tempslider::-webkit-slider-thumb{background:#ffb86b}
  .tempslider::-moz-range-thumb{background:#ffb86b}
  .temprow{display:flex;align-items:center;gap:8px;margin-top:4px}
  .temprow button{padding:2px 8px;font-size:11px}
  .nlwarn{font-size:11px;color:#ffd28a;line-height:1.55;margin-top:4px}
  .bhint{font-size:11px;color:#ffd28a;margin-top:5px}
  .bhint summary{cursor:pointer;outline:none}
  .bhint summary:hover{text-decoration:underline}
  .berr{font-size:11px;color:#ffb3ad;line-height:1.55;margin-top:5px;white-space:pre-wrap;word-break:break-word}
  /* 分辨率 / 刷新率 */
  .modes{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
  .modes .mcur{margin-left:auto;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
  .moderow{display:flex;gap:6px;align-items:center;margin-top:5px}
  .moderow select{min-width:0;flex:1}
  .moderow button{padding:4px 10px;font-size:12px;white-space:nowrap}
  .modes .restore{margin-top:6px;width:100%;padding:4px 8px;font-size:11.5px}
  #modeBar{
    position:fixed;left:50%;bottom:76px;transform:translateX(-50%);
    display:none;align-items:center;gap:12px;z-index:56;max-width:min(880px,94vw);
    background:#1b2430;border:1px solid #d29922;border-radius:9px;padding:9px 14px;font-size:12.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #modeBar.show{display:flex}
  #modeBar b{color:#ffd28a}
  .asideFoot{padding:10px 12px;border-top:1px solid var(--line)}
  .asideFoot summary{cursor:pointer;color:var(--dim);font-size:12px;outline:none}
  .asideFoot .help{margin-top:8px}
  /* 护眼休息 */
  .breakCard{
    flex:0 0 auto;margin:12px 12px 0;padding:10px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  }
  .breakCard h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
  .breakCard h3 .badge{margin-left:auto}
  .bkStatus{font-size:12.5px;line-height:1.55;font-variant-numeric:tabular-nums}
  .bkStatus b{color:var(--text)}
  .bkStatus small{color:var(--dim)}
  .bkRow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .bkRow input[type=number]{
    width:58px;font:inherit;color:var(--text);background:#0d1117;
    border:1px solid var(--line);border-radius:5px;padding:3px 5px;
  }
  .bkRow select{flex:1;min-width:0}
  .breakCard .bkToggle{margin-top:8px;width:100%;padding:5px 8px}
  .breakCard .help{margin-top:7px}
  #mask{
    position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  #mask.show{display:flex}
  #modal{
    width:min(520px,100%);background:#141a20;border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #modal h2{margin:0 0 12px;font-size:15px}
  #modal .rows{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .row{display:flex;gap:10px;font-size:12.5px}
  .row .k{color:var(--dim);width:92px;flex:0 0 92px}
  .row .v{flex:1;word-break:break-all}
  .dangerBox{border:1px solid #8b2c2c;background:#2a1414;color:#ffb3ad;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.6}
  .warnBox{border:1px solid #9e6a03;background:#2b2007;color:#ffd28a;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.6}
  .modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .toggleRow{display:flex;align-items:center;gap:8px;margin-top:12px}
  .toggleBtn{
    display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:12px;
    background:#1b2430;border:1px solid var(--line);border-radius:7px;
  }
  .toggleBtn .dot{
    width:10px;height:10px;border-radius:50%;background:#39424d;border:1px solid #4b5763;
  }
  .toggleBtn.on{border-color:#2ea043;background:#12281a;color:#7ee787}
  .toggleBtn.on .dot{background:#3fb950;border-color:#3fb950}
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#1f2730;border:1px solid var(--line);border-radius:8px;padding:9px 16px;
    opacity:0;transition:.25s;pointer-events:none;max-width:min(720px,90vw);font-size:12.5px;z-index:60;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:#8b2c2c;background:#2a1414;color:#ffb3ad}
  #logBox{
    display:none;position:fixed;right:16px;bottom:16px;width:min(620px,46vw);max-height:44vh;
    overflow:auto;background:#0d1117;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#9fb0c0;z-index:40;
    white-space:pre-wrap;
  }
  #logBox.show{display:block}
</style>
</head>
<body>
<header>
  <h1>显示器输出管理</h1>
  <span id="conn" class="conn">● 连接中…</span>
  <div class="meta">固定布局 <b id="canvasSize">-</b> · 当前 <b id="canvasLive">-</b> · 启用 <b id="enabledCount">-</b> 块 · 更新于 <b id="stamp">-</b></div>
  <div class="spacer"></div>
  <label class="meta" style="display:flex;align-items:center;gap:6px">
    闲置阈值
    <select id="thresholdSel" title="某块屏超过这个时间没有画面变化，就在布局图上提示闲置">
      <option value="0">不提醒</option>
      <option value="60">1 分钟</option>
      <option value="120">2 分钟</option>
      <option value="300">5 分钟</option>
      <option value="600">10 分钟</option>
      <option value="900">15 分钟</option>
      <option value="1800">30 分钟</option>
      <option value="3600">1 小时</option>
    </select>
  </label>
  <button id="btnRefresh" class="ghost">刷新</button>
  <button id="btnRestore" class="ghost">恢复全部</button>
  <button id="btnLog" class="ghost">日志</button>
</header>

<main>
  <div id="stage">
    <div id="canvasWrap">
      <svg id="layout" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="layoutBar"></div>
    <div id="offTray"></div>
  </div>

  <aside>
    <div id="breakPanel" class="breakCard"></div>
    <div class="asideScroll" id="cards"></div>
    <div class="asideFoot">
      <details>
        <summary>闲置提醒是怎么判断的（点开看局限）</summary>
        <div class="help" id="idleHelp">
          当前判据：<b id="idleBasis">-</b><br>
          原理：在 X11 根窗口上监听画面变化（XDamage），把变化区域和各屏的位置做交集，
          近似判断「这块屏多久没变化」。这只是近似信号，不是精确测量：<br>
          · 静止的桌面/壁纸本来就没变化，可能被误判为闲置；<br>
          · 屏亮着但没人看也会被判闲置；<br>
          · 视频若走硬件叠加层，可能完全不产生变化事件。<br>
          所以这里只做提醒，是否关闭由你点按钮决定，绝不自动关。
        </div>
      </details>
    </div>
  </aside>
</main>

<div id="mask">
  <div id="modal">
    <h2 id="mTitle">确认关闭</h2>
    <div class="rows" id="mRows"></div>
    <div id="mWarn"></div>
    <div class="modalActions">
      <button id="mCancel">取消</button>
      <button id="mOk" class="danger">确认关闭</button>
    </div>
  </div>
</div>

<div id="modeBar">
  <span id="modeBody"></span>
  <button id="modeKeep" class="primary">保持此设置</button>
  <button id="modeUndo" class="danger">撤销</button>
</div>

<div id="toast"></div>
<div id="logBox"></div>

<script>
const $ = s => document.querySelector(s);
const POLL_MS = 2000;

let state = null;
let selected = null;
let busy = false;
let dialogOpen = false;
let connected = null;        // null=未知 true=已连接 false=断开
let lastSig = null;          // 结构签名：没变化就不重建 DOM，避免每 2 秒重绘导致按钮点不中
let brightTimer = {};        // 每块屏的节流定时器
let brightDraft = {};        // 拖动中的本地值
let brightSeq = {};          // 每个输出最近一次请求序号，防止旧响应覆盖新值
let brightLastSent = {};     // 上一次成功下发的值，拖动时相同值不重复发
let brightErr = {};          // 最近一次失败的提示
let brightDragging = null;   // 正在拖动的输出名（拖动时不做重建/回写）

/* ---------------- 数据 ---------------- */
async function fetchState(){
  const r = await fetch('/api/state', {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || '读取状态失败');
  return j;
}

async function post(url, body){
  const r = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body || {})
  });
  const j = await r.json().catch(()=>({ok:false,error:'返回不是 JSON'}));
  if(!r.ok && j.ok !== false) j.ok = false;
  return j;
}

function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>{ t.className = isErr ? 'err' : ''; }, 5200);
}

function setConn(ok){
  if(ok){
    if(connected === false) toast('已重新连上本地服务');
    connected = true;
    $('#conn').textContent = '● 已连接';
    $('#conn').className = 'conn ok';
  }else{
    connected = false;
    $('#conn').textContent = '● 服务未连接，自动重试中';
    $('#conn').className = 'conn bad';
  }
}

async function refresh(manual){
  try{
    state = await fetchState();
    if(manual){
      // 手动刷新时顺便重读亮度硬件值（DDC 的 getvcp / sysfs / gamma）
      try{
        const b = await (await fetch('/api/brightness?refresh=1')).json();
        if(b && b.ok && state.brightness) Object.assign(state.brightness, b.brightness);
      }catch(e){ /* 亮度刷新失败不影响布局状态 */ }
    }
    if(selected && !state.outputs.some(o=>o.name===selected)) selected = null;
    setConn(true);
    paintBreak(state.break);   // 护眼休息就地更新，不受下面「结构没变就直接返回」影响
    render();
    if(manual) toast('状态已更新');
    return true;
  }catch(e){
    setConn(false);
    if(manual) toast('暂时连不上本地服务，页面会自动重试', true);
    return false;
  }
}

/* ---------------- 渲染布局图 ---------------- */
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function svgText(parent, x, y, txt, size, color, weight){
  const t = svgEl('text', {
    x, y, 'text-anchor':'middle', fill:color,
    'font-size':size, 'font-weight':weight || 400,
    'font-family':'"Noto Sans CJK SC",sans-serif',
    'pointer-events':'none'
  });
  t.textContent = txt;
  parent.appendChild(t);
  return t;
}

// 在屏块内部画一个可点击按钮；disabled 时只画灰条，不响应点击
function svgButton(parent, o, label, disabled, isDanger, onClick){
  const fs = Math.max(24, Math.min(92, o.h*0.058));
  const bw = Math.min(o.w*0.34, Math.max(label.length*fs*0.72 + fs*2.0, fs*7.5));
  const bh = fs*2.05;
  const bx = o.x + o.w/2 - bw/2;
  const by = o.y + o.h - bh - o.h*0.05;
  const g = svgEl('g', {style: disabled ? 'cursor:not-allowed' : 'cursor:pointer'});
  g.appendChild(svgEl('rect', {
    x:bx, y:by, width:bw, height:bh, rx:bh*0.32,
    fill: disabled ? '#20262e' : (isDanger ? '#3a1a1a' : '#17351f'),
    stroke: disabled ? '#39424d' : (isDanger ? '#8b2c2c' : '#2ea043'),
    'stroke-width':Math.max(2, fs*0.09)
  }));
  svgText(g, bx+bw/2, by+bh*0.68, label, fs,
          disabled ? '#6e7b88' : (isDanger ? '#ffb3ad' : '#7ee787'), 600);
  if(!disabled){
    g.addEventListener('click', ev=>{ ev.stopPropagation(); onClick(); });
  }
  parent.appendChild(g);
}

function renderCanvas(){
  const svg = $('#layout');
  svg.innerHTML = '';
  const on = state.outputs.filter(o=>o.enabled);
  if(!on.length){
    svg.setAttribute('viewBox', '0 0 100 60');
    svgText(svg, 50, 32, '当前没有任何启用的输出', 4, '#8b98a5');
    return;
  }
  // 大块先画、小块后画：真重叠时小块压在上面，和实际「后配置的盖住先配置的」一致
  const onSorted = on.slice().sort((a,b)=> b.w*b.h - a.w*a.h);
  // 已关闭但有恢复记录的输出：只画虚线幽灵框，预告「点开启后会放在这里」（后端已算好避让位置）
  const ghosts = state.outputs.filter(o=>o.restore_preview);
  const gwh = g => g.restore_preview.geometry.split('x').map(Number);
  const box = state.canvas;          // 规范布局的 union：所有输出都在框内，跟着开关不变
  const pad = Math.max(...on.map(o=>o.h), box ? box.h : 0) * 0.025;
  const xs0 = on.map(o=>o.x).concat(ghosts.map(g=>g.restore_preview.pos[0]));
  const ys0 = on.map(o=>o.y).concat(ghosts.map(g=>g.restore_preview.pos[1]));
  const xs1 = on.map(o=>o.x+o.w).concat(ghosts.map(g=>g.restore_preview.pos[0]+gwh(g)[0]));
  const ys1 = on.map(o=>o.y+o.h).concat(ghosts.map(g=>g.restore_preview.pos[1]+gwh(g)[1]));
  if(box){ xs0.push(box.x); ys0.push(box.y); xs1.push(box.x+box.w); ys1.push(box.y+box.h); }
  const x0 = Math.min(...xs0) - pad;
  const y0 = Math.min(...ys0) - pad;
  const x1 = Math.max(...xs1) + pad;
  const y1 = Math.max(...ys1) + pad;
  svg.setAttribute('viewBox', `${x0} ${y0} ${x1-x0} ${y1-y0}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  if(box){
    svg.appendChild(svgEl('rect', {
      x: box.x, y: box.y, width: box.w, height: box.h, fill:'none',
      stroke:'#2a333d', 'stroke-width': pad*0.12,
      'stroke-dasharray': `${pad*0.5} ${pad*0.35}`
    }));
  }

  // 已关闭输出的幽灵框：空心虚线、无按钮，明确不是正在生效的桌面
  for(const o of ghosts){
    const p = o.restore_preview;
    const [gw, gh] = gwh(o);
    const [gx, gy] = p.pos;
    const g = svgEl('g', {style:'cursor:pointer'});
    g.appendChild(svgEl('rect', {
      x:gx, y:gy, width:gw, height:gh, rx:Math.min(gw,gh)*0.012,
      fill:'rgba(148,163,184,.045)', stroke:'#55606d',
      'stroke-width':Math.max(2, Math.min(gw,gh)*0.003),
      'stroke-dasharray':`${Math.max(8, gh*0.014)} ${Math.max(6, gh*0.01)}`
    }));
    const fs = Math.max(22, Math.min(72, gh*0.05));
    let ty = gy + gh*0.5 - fs*1.6;
    const lines = [
      {t:`${o.name} · 已关闭`, s:fs*1.15, c:'#8b98a5', w:600},
      {t:`开启后 ${gw}×${gh} @ ${gx},${gy}`, s:fs*0.8, c:'#6e7b88'},
      {t:`${p.mode}  ${p.rate}Hz`, s:fs*0.8, c:'#6e7b88'},
      {t: p.source === 'layout' ? '固定布局位置 · 开启后即在此处' :
          (p.relocated ? `已避开正在用的屏（原记录 ${p.want[0]},${p.want[1]}）` : '按关闭前的位置放回'),
       s:fs*0.8, c: p.relocated && p.source !== 'layout' ? '#d29922' : '#6e7b88'},
    ];
    for(const ln of lines){ svgText(g, gx+gw/2, ty, ln.t, ln.s, ln.c, ln.w); ty += ln.s*1.45; }
    g.addEventListener('click', ()=>{ selected = o.name; render(true); });
    svg.appendChild(g);
  }

  const overlapped = new Set();
  (state.overlaps||[]).forEach(o=>{ overlapped.add(o.a); overlapped.add(o.b); });

  for(const o of onSorted){
    const sel = o.name === selected;
    const isOv = overlapped.has(o.name);
    const gw = svgEl('g', {class:'rbox'});
    const rect = svgEl('rect', {
      class:'screen',
      x:o.x, y:o.y, width:o.w, height:o.h, rx:Math.min(o.w,o.h)*0.012,
      fill: sel ? '#1b3b5c' : '#182129',
      stroke: isOv ? '#f85149' : (sel ? '#58a6ff' : '#39424d'),
      'stroke-width': Math.max(2, Math.min(o.w,o.h)*0.004)
    });
    rect.addEventListener('click', ()=>{ selected = o.name; render(true); });
    gw.appendChild(rect);

    // 实际位置和固定布局不一致：把固定位置用琥珀虚线标出来（它只是提醒会落回哪，不是另一块屏）
    if(o.drift){
      const [dw, dh] = o.drift.geometry.split('x').map(Number);
      gw.appendChild(svgEl('rect', {
        x:o.drift.pos[0], y:o.drift.pos[1], width:dw, height:dh, rx:Math.min(dw,dh)*0.012,
        fill:'none', stroke:'#d29922', 'stroke-width':Math.max(2, Math.min(dw,dh)*0.004),
        'stroke-dasharray':`${Math.max(10, dh*0.02)} ${Math.max(8, dh*0.014)}`,
        'pointer-events':'none'
      }));
      svgText(gw, o.drift.pos[0]+dw/2, o.drift.pos[1]+dh*0.5,
              `固定位置 ${o.drift.pos[0]},${o.drift.pos[1]}（关掉再开会落回这里）`,
              Math.max(22, Math.min(64, dh*0.045)), '#d29922', 600);
    }

    // 闲置：只把底色压暗，文字与按钮保持可读
    if(o.idle){
      gw.appendChild(svgEl('rect', {
        x:o.x, y:o.y, width:o.w, height:o.h, rx:Math.min(o.w,o.h)*0.012,
        fill:'rgba(4,7,10,.45)', 'pointer-events':'none'
      }));
    }

    const fs = Math.max(24, Math.min(96, o.h*0.062));
    const cx = o.x + o.w/2;
    let ty = o.y + o.h/2 - fs*2.0;
    const lines = [
      {t:o.name + (o.primary ? '  ★ primary' : ''), s:fs*1.35, c:'#e6edf3', w:600},
      {t:`${o.w}×${o.h}  @ ${o.x},${o.y}`, s:fs*0.8, c:'#9fb0c0'},
      {t:`${o.mode}  ${o.rate}Hz`, s:fs*0.8, c:'#9fb0c0'},
      {t:`缩放 ${o.scale ? o.scale.toFixed(0)+'%' : '-'}（transform ${o.transform ? o.transform[0].toFixed(4) : '-'}）`, s:fs*0.8, c:'#9fb0c0'},
      {t: o.panel ? '内屏 · 已启用' : '已启用', s:fs*0.8, c:'#7ee787'},
    ];
    for(const ln of lines){ svgText(gw, cx, ty, ln.t, ln.s, ln.c, ln.w); ty += ln.s*1.45; }

    // 每块屏自带开关按钮（内屏也允许关，唯一硬限制是不能关掉最后一块亮屏）
    if(state.enabled_count <= 1){
      svgButton(gw, o, '最后一块亮屏不可关', true, false);
    }else{
      svgButton(gw, o, o.panel ? '关闭（内屏）' : (o.idle ? '关闭此输出' : '关闭'),
                false, true, ()=>doOff(o.name));
    }

    // 闲置角标（非模态，点角标直接走关闭确认）
    if(o.idle){
      const bfs = Math.max(18, Math.min(52, o.h*0.034));
      const label = `闲置 ${fmtDur(o.idle_seconds)}　关闭`;
      const bw = label.length * bfs * 0.66 + bfs*1.8;
      const bh = bfs * 1.95;
      const bx = o.x + o.w - bw - o.w*0.02;
      const by = o.y + o.h*0.02;
      const badge = svgEl('g', {style:'cursor:pointer'});
      badge.appendChild(svgEl('rect', {
        x:bx, y:by, width:bw, height:bh, rx:bh*0.35,
        fill:'#3a1a1a', stroke:'#f85149', 'stroke-width':Math.max(2, bfs*0.09)
      }));
      svgText(badge, bx+bw/2, by+bh*0.68, label, bfs, '#ffb3ad', 600);
      badge.addEventListener('click', ev=>{ ev.stopPropagation(); doOff(o.name); });
      gw.appendChild(badge);
    }
    svg.appendChild(gw);
  }

  // 真重叠（两块都亮着）：在交集上画红框并点名，避免「大框没标题」看不出是哪块屏
  for(const ov of (state.overlaps||[])){
    const a = on.find(o=>o.name===ov.a), b = on.find(o=>o.name===ov.b);
    if(!a || !b) continue;
    const ix = Math.max(a.x, b.x), iy = Math.max(a.y, b.y);
    const iw = Math.min(a.x+a.w, b.x+b.w) - ix;
    const ih = Math.min(a.y+a.h, b.y+b.h) - iy;
    if(iw <= 0 || ih <= 0) continue;
    svg.appendChild(svgEl('rect', {
      x:ix, y:iy, width:iw, height:ih, fill:'rgba(248,81,73,.07)',
      stroke:'#f85149', 'stroke-width':Math.max(2, Math.min(iw,ih)*0.004),
      'stroke-dasharray':`${Math.max(10, ih*0.02)} ${Math.max(7, ih*0.014)}`,
      'pointer-events':'none'
    }));
    const label = `${ov.a} ↔ ${ov.b} 实际重叠 ${ov.w}×${ov.h}`;
    const bfs = Math.max(22, Math.min(56, Math.min(iw,ih)*0.045));
    const bw = label.length * bfs * 0.62 + bfs*1.6;
    const bh = bfs * 1.9;
    const bx = ix + iw*0.012, by = iy + ih*0.012;
    const badge = svgEl('g', {style:'pointer-events:none'});
    badge.appendChild(svgEl('rect', {
      x:bx, y:by, width:bw, height:bh, rx:bh*0.3,
      fill:'#3a1a1a', stroke:'#f85149', 'stroke-width':Math.max(2, bfs*0.08)
    }));
    svgText(badge, bx+bw/2, by+bh*0.68, label, bfs, '#ffb3ad', 600);
    svg.appendChild(badge);
  }
}

function fmtCanvas(c){ return c ? `${c.w}×${c.h}` : '-'; }

function fmtDur(sec){
  if(sec === null || sec === undefined) return '-';
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
}

function renderTray(){
  const tray = $('#offTray');
  tray.innerHTML = '';
  const off = state.outputs.filter(o=>o.status==='connected' && !o.enabled);
  if(!off.length) return;
  const label = document.createElement('span');
  label.className = 'meta';
  label.textContent = '未启用的输出（虚线框 = 点开启后会放的位置，不参与画布尺寸）：';
  tray.appendChild(label);
  for(const o of off){
    const chip = document.createElement('div');
    chip.className = 'chip' + (o.name===selected ? ' on-cur' : '');
    chip.innerHTML = `<span>${o.name}${o.panel?' · 内屏':''}</span>`;
    const b = document.createElement('button');
    b.className = 'primary';
    b.textContent = '开启';
    b.onclick = e=>{ e.stopPropagation(); doOn(o.name); };
    chip.appendChild(b);
    chip.onclick = ()=>{ selected = o.name; render(true); };
    tray.appendChild(chip);
  }
}

function renderLayoutBar(){
  const bar = $('#layoutBar');
  const lay = state.layout || {outputs:{}, confirmed:false, updated:null};
  const names = Object.keys(lay.outputs).sort();
  bar.innerHTML = '';
  if(!names.length) return;

  const line = document.createElement('div');
  line.className = 'tray';
  const label = document.createElement('span');
  label.className = 'meta';
  label.textContent = '固定布局（开关屏只改亮灭，坐标不动）：' +
    names.map(n=>`${n} ${lay.outputs[n].pos.join(',')}`).join(' · ');
  line.appendChild(label);
  if(!lay.confirmed){
    const w = document.createElement('span');
    w.className = 'meta';
    w.style.color = '#d29922';
    w.textContent = '· 待你确认';
    line.appendChild(w);
  }

  const mk = (text, fn, cls) => {
    const b = document.createElement('button');
    b.textContent = text;
    if(cls) b.className = cls;
    b.onclick = fn;
    return b;
  };
  const run = async (body, okMsg) => {
    try{
      const j = await post('/api/layout', body);
      if(j.ok === false) throw new Error(j.error || '未知错误');
      toast(okMsg);
      refresh();
    }catch(e){ toast(okMsg + '失败：' + e.message, true); }
  };
  if(!lay.confirmed){
    line.appendChild(mk('确认这份布局', ()=>run({action:'confirm'}, '已把这份摆位固化为规范布局'), 'primary'));
  }
  line.appendChild(mk('按当前实际布局认领',
    ()=>run({action:'claim'}, '已按当前实际布局认领')));
  bar.appendChild(line);

  // 手工改坐标：两块屏的固定位置重叠时后端会拒绝，不会把重叠写进规范布局
  const det = document.createElement('details');
  det.style.marginTop = '6px';
  const sum = document.createElement('summary');
  sum.className = 'meta';
  sum.textContent = '调整固定坐标（改完点保存即可，不影响当前亮着的屏）';
  det.appendChild(sum);
  const ed = document.createElement('div');
  ed.className = 'tray';
  ed.style.marginTop = '6px';
  const inputs = {};
  for(const n of names){
    const wrap = document.createElement('label');
    wrap.className = 'meta';
    wrap.style.display = 'flex';
    wrap.style.alignItems = 'center';
    wrap.style.gap = '4px';
    wrap.textContent = n;
    const ix = document.createElement('input');
    ix.type = 'number'; ix.value = lay.outputs[n].pos[0]; ix.style.width = '90px';
    const iy = document.createElement('input');
    iy.type = 'number'; iy.value = lay.outputs[n].pos[1]; iy.style.width = '90px';
    wrap.appendChild(ix); wrap.appendChild(iy);
    inputs[n] = [ix, iy];
    ed.appendChild(wrap);
  }
  ed.appendChild(mk('保存固定坐标', ()=>{
    const pos = {};
    for(const n of names) pos[n] = [Number(inputs[n][0].value), Number(inputs[n][1].value)];
    run({action:'set', pos}, '固定坐标已保存');
  }, 'primary'));
  det.appendChild(ed);
  bar.appendChild(det);
}

function renderCards(){
  const box = $('#cards');
  box.innerHTML = '';
  for(const o of state.outputs){
    if(o.status === 'disconnected') continue;   // 未连接的输出没有可操作价值，略过
    const card = document.createElement('div');
    card.className = 'card' + (o.name===selected ? ' sel':'');
    const badges = [];
    badges.push(o.enabled ? '<span class="badge live">已启用</span>'
                          : '<span class="badge dead">已关闭</span>');
    if(o.primary) badges.push('<span class="badge info">primary</span>');
    if(o.panel) badges.push('<span class="badge warn">内屏</span>');
    if(o.off_marked) badges.push('<span class="badge">你关闭的</span>');
    if(o.enabled && o.off_marked) badges.push('<span class="badge dead">名单里却亮着</span>');
    if(o.idle) badges.push(`<span class="badge dead">闲置 ${fmtDur(o.idle_seconds)}</span>`);
    card.innerHTML = `<h3>${o.name} ${badges.join('')}</h3>`;

    const kv = document.createElement('div');
    kv.className = 'kv';
    const p = o.restore_preview;
    const canon = o.canonical;
    const rows = o.enabled ? [
      ['分辨率', `${o.w}×${o.h}`],
      ['模式', `${o.mode} @ ${o.rate} Hz`],
      ['位置', `${o.x}, ${o.y}${canon ? (o.drift ? `（固定 ${canon.pos[0]},${canon.pos[1]}，当前偏离）` : '（= 固定布局）') : ''}`],
      ['缩放', `${o.scale ? o.scale.toFixed(0)+'%' : '-'}`],
      ['画面静止', o.idle_seconds === null ? '-' : fmtDur(o.idle_seconds)],
    ] : [
      ['状态', '已关闭（坐标不变）'],
      ...(p ? [
        ['开启后位置', `${p.pos[0]}, ${p.pos[1]}${p.source === 'layout' ? '（固定布局）' : (p.relocated ? '（临时避让）' : '')}`],
        ['开启后几何', `${p.geometry} · ${p.mode} @ ${p.rate} Hz · 缩放 ${p.scale.toFixed(0)}%`],
        ['几何来源', p.source === 'layout' ? '规范布局 · 关闭不改' :
                     (p.source === 'state' ? '旧四件套（待认领）' : '看门狗基线（待认领）')],
      ] : [['恢复参数', '无记录，只能按 xrandr 默认（--auto）']]),
    ];
    kv.innerHTML = rows.map(([k,v])=>`<span>${k}</span><span>${v}</span>`).join('');
    card.appendChild(kv);

    if(o.enabled && o.off_marked){
      const hint = document.createElement('div');
      hint.className = 'help';
      hint.style.marginTop = '7px';
      hint.textContent = '它在「你关闭的」名单里，但当前确实是亮的——多半是挂起/恢复时被系统重新点亮。' +
                         '布局图按实际状态画；要关掉它请点下面的「关闭」，想保留现状就保持亮着（重启服务时会自动把它从名单里去掉）。';
      card.appendChild(hint);
    }

    if(o.enabled){
      const mwrap = buildModes(o);
      if(mwrap) card.appendChild(mwrap);
    }

    const bwrap = buildBright(o);
    if(bwrap) card.appendChild(bwrap);

    if(o.enabled && o.idle){
      const hint = document.createElement('div');
      hint.className = 'help';
      hint.style.marginTop = '7px';
      hint.textContent = `这块屏 ${fmtDur(o.idle_seconds)} 没有画面变化，要不要关掉？（${o.idle_basis}）`;
      card.appendChild(hint);
    }

    const acts = document.createElement('div');
    acts.className = 'cardActions';
    if(o.enabled){
      const b = document.createElement('button');
      b.className = 'danger';
      b.textContent = o.panel ? '关闭（内屏）' : (o.idle ? '关闭此输出' : '关闭');
      if(state.enabled_count <= 1){
        b.disabled = true;
        b.title = '这是最后一块启用的屏，不能关闭';
        b.textContent = '最后一块亮屏不可关';
      }
      b.onclick = e=>{ e.stopPropagation(); doOff(o.name); };
      acts.appendChild(b);
    }else{
      const b = document.createElement('button');
      b.className = 'primary';
      b.textContent = '开启';
      b.onclick = e=>{ e.stopPropagation(); doOn(o.name); };
      acts.appendChild(b);
    }
    card.appendChild(acts);
    card.onclick = ()=>{ selected = o.name; render(true); };
    box.appendChild(card);
  }
}

function syncThreshold(){
  const sel = $('#thresholdSel');
  const v = state.config ? state.config.idle_threshold : 300;
  if(document.activeElement === sel) return;
  let opt = Array.from(sel.options).find(x=>Number(x.value) === v);
  if(!opt){
    opt = document.createElement('option');
    opt.value = String(v);
    opt.textContent = v === 0 ? '不提醒' : `自定义 ${v} 秒`;
    sel.appendChild(opt);
  }
  sel.value = String(v);
}

  const p = $('#breakPanel');
  p.innerHTML = `
    <h3>护眼休息 <span id="bkBadge" class="badge">-</span></h3>
    <div class="bkStatus" id="bkStatus">-</div>
    <div class="bkRow">
      <span>工作</span><input id="bkWork" type="number" min="1" max="240" step="1"
        title="连续用眼多少分钟后提醒休息（1~240 分钟）"><span>分钟</span>
      <span style="margin-left:6px">休息</span><input id="bkBreak" type="number" min="1" max="60" step="1"
        title="每次休息覆盖层显示多久（1~60 分钟）"><span>分钟</span>
    </div>
    <div class="bkRow"><span>覆盖屏</span><select id="bkScreen"
      title="到点后只在这块屏上铺倒计时，其他屏不受影响"></select></div>
    <button id="bkToggle" class="ghost bkToggle">启用</button>
    <div class="help">

      它的作用只是打断近距离用眼、引导远眺和提醒眨眼——<b>不是治疗</b>，也不声称动画能改善视力。
      覆盖层不会比你当前的画面更亮：背景固定在 #12161A~#1B2328，文字亮度跟随当前亮度，色温沿用当前设置。
    </div>`;
  $('#bkWork').onchange = ()=> saveBreak({work_min: Number($('#bkWork').value)});

  $('#bkScreen').onchange = ()=> saveBreak({screen: $('#bkScreen').value});
  $('#bkToggle').onclick = ()=>{

function syncBreakScreens(b){
  const sel = $('#bkScreen');
  if(document.activeElement === sel) return;
  const names = state.outputs.filter(o=>o.enabled).map(o=>o.name);
  const key = names.join(',') + '|' + b.screen;
  if(sel.dataset.key !== key){
    sel.innerHTML = '';
    for(const n of names){
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    }
    if(!names.includes(b.screen)){
      const o = document.createElement('option');
      o.value = b.screen; o.textContent = `${b.screen}（未启用）`;
      sel.appendChild(o);
    }
    sel.dataset.key = key;
  }
  sel.value = b.screen;
}

// 每 2 秒随状态轮询更新一次，就地改文字，不重建 DOM（避免输入框失焦）
function paintBreak(b){
  if(!b) return;
  const badge = $('#bkBadge');
  if(!badge) return;
  const fast = b.enabled ? (b.phase === 'break' ? ['badge live', '休息中'] : ['badge info', '专注中'])
                         : ['badge dead', '已暂停'];
  badge.className = fast[0];
  badge.textContent = fast[1];
  const st = $('#bkStatus');
  if(!b.enabled){
    st.innerHTML = `已暂停 <small>· 计时冻结在距下次休息 ${Math.max(0, Math.ceil(b.remaining/60))} 分钟</small>`;
  }else if(b.phase === 'break'){
    st.innerHTML = `休息中 <small>· 剩余 ${fmtDur(b.remaining)}，按 ESC 或点「跳过」可提前结束</small>`;
  }else if(b.idle_postponed){
    st.innerHTML = `闲置提醒正在显示 <small>· 本轮休息延后 ${Math.round(b.defer)} 秒后再试，两个覆盖层不叠加</small>`;
  }else{
    st.innerHTML = `距下次休息 <b>${Math.ceil(b.remaining/60)}</b> 分钟`
                 + `<small> · 第 ${b.round + 1} 轮，已跳过 ${b.skip_count || 0} 次</small>`;
  }
  const w = $('#bkWork'), r = $('#bkBreak');
  if(document.activeElement !== w) w.value = b.work_min;
  if(document.activeElement !== r) r.value = b.break_min;
  syncBreakScreens(b);
  const t = $('#bkToggle');
  t.textContent = b.enabled ? '暂停（开会 / 演示时用）' : '启用';
  t.className = 'bkToggle ' + (b.enabled ? 'ghost' : 'primary');
}

async function saveBreak(patch){
  const r = await post('/api/break', patch);
  if(r.ok && r.break){
    state.break = r.break;
    paintBreak(r.break);
    if('enabled' in patch) toast(r.break.enabled ? '护眼休息已启用' : '护眼休息已暂停');
  }else{
    toast('护眼休息设置失败：' + (r.error || '未知错误'), true);
    refresh(false);
  }
}

// 只把「会改变结构/文案」的字段放进来；闲置秒数按分钟取整，避免每 2 秒重绘
function structuralSig(s){
  return JSON.stringify({
    canvas: s.canvas,
    n: s.enabled_count,
    th: s.config && s.config.idle_threshold,
    basis: s.idle && s.idle.basis,
    ov: s.overlaps || [],
    lay: s.layout ? [s.layout.confirmed, s.layout.updated,
                     Object.keys(s.layout.outputs||{}).sort().map(k=>[k, s.layout.outputs[k].pos.join(',')])] : null,
    sel: selected,
    o: s.outputs.map(o=>[
      o.name, o.status, o.enabled, o.primary, o.panel, o.off_marked, o.idle,
      o.x, o.y, o.w, o.h, o.mode, o.rate, o.scale,
      o.transform ? o.transform[0] : null,
      o.restore_preview ? [o.restore_preview.pos.join(','), o.restore_preview.relocated,
                           o.restore_preview.mode, o.restore_preview.rate].join('|') : null,
      o.drift ? o.drift.pos.join(',') : null,
      o.idle ? Math.floor((o.idle_seconds||0)/60) : null
    ]),
    // 亮度只放「能力」相关字段；具体数值不进签名，拖动时不重建 DOM
    b: s.brightness ? Object.keys(s.brightness).sort().map(k=>{
      const b = s.brightness[k];
      return [k, b.mode, b.available, b.mode_label, b.reason,
              b.temp_ready, !!(b.night_light && b.night_light.enabled)];
    }) : []
  });
}

function render(force){
  if(!state) return;
  $('#stamp').textContent = state.time;
  syncBrightSliders();
  const sig = structuralSig(state);
  // 拖动亮度的瞬间不重建卡片，否则滑杆元素被替换，手柄会跳、拖动会断
  if(!force && (sig === lastSig || brightDragging)) return;
  lastSig = sig;
  $('#canvasSize').textContent = fmtCanvas(state.canvas);
  $('#canvasLive').textContent = fmtCanvas(state.canvas_live);
  $('#enabledCount').textContent = state.enabled_count;
  $('#idleBasis').textContent = state.idle ? state.idle.basis : '-';
  syncThreshold();
  renderCanvas();
  renderLayoutBar();
  renderTray();
  renderCards();
}

/* ---------------- 分辨率 / 刷新率 ---------------- */
// 只列 xrandr 实际暴露的模式/刷新率（后端解析自 xrandr --current），不臆造；
// 默认选中当前值。应用只改这块屏的 mode/rate，缩放与位置由后端原样带上。
function buildModes(o){
  const info = state.modes && state.modes.outputs && state.modes.outputs[o.name];
  if(!info || !info.modes || !info.modes.length) return null;
  const wrap = document.createElement('div');
  wrap.className = 'modes';
  wrap.dataset.out = o.name;

  const head = document.createElement('div');
  head.className = 'brightHead';
  head.innerHTML = `<span>分辨率 / 刷新率</span><b class="mcur">${o.mode} @ ${o.rate} Hz</b>`;
  wrap.appendChild(head);

  const row = document.createElement('div');
  row.className = 'moderow';

  const ms = document.createElement('select');
  ms.className = 'msel';
  for(const m of info.modes){
    const opt = document.createElement('option');
    opt.value = m.mode;
    opt.textContent = m.mode;
    if(m.mode === o.mode) opt.selected = true;
    ms.appendChild(opt);
  }
  if(![...ms.options].some(x=>x.selected)) ms.selectedIndex = 0;

  const rs = document.createElement('select');
  rs.className = 'rsel';
  const fillRates = ()=>{
    const m = info.modes.find(x=>x.mode===ms.value) || info.modes[0];
    rs.innerHTML = '';
    for(const r of m.rates){
      const opt = document.createElement('option');
      opt.value = r.rate;
      opt.textContent = r.rate + ' Hz' + (r.preferred ? '（首选）' : '');
      if(m.mode === o.mode && Math.abs(Number(r.rate) - Number(o.rate)) < 0.05) opt.selected = true;
      rs.appendChild(opt);
    }
    if(![...rs.options].some(x=>x.selected)) rs.selectedIndex = 0;
  };
  fillRates();
  ms.onchange = fillRates;

  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = '应用';
  btn.title = '只改这块屏的模式与刷新率；缩放、位置、primary 原样保留，其他输出不动';
  btn.onclick = ev=>{ ev.stopPropagation(); applyMode(o.name, ms.value, rs.value); };
  row.appendChild(ms); row.appendChild(rs); row.appendChild(btn);
  wrap.appendChild(row);

  const lg = state.modes.last_good;
  if(lg && lg.name === o.name &&
     !(lg.mode === o.mode && Math.abs(Number(lg.rate) - Number(o.rate)) < 0.05)){
    const rb = document.createElement('button');
    rb.className = 'ghost restore';
    rb.textContent = `恢复上次可用模式（${lg.mode} @ ${lg.rate} Hz）`;
    rb.onclick = ev=>{ ev.stopPropagation(); restoreLastMode(); };
    wrap.appendChild(rb);
  }

  const note = document.createElement('div');
  note.className = 'bnote';
  note.textContent = `只列出这块屏 xrandr 实际暴露的模式。应用后 ${info.confirm_seconds || 15} 秒内`
    + '不确认会自动退回上一个模式，黑屏也能自动恢复。';
  wrap.appendChild(note);
  wrap.onclick = ev=> ev.stopPropagation();
  return wrap;
}

let modeTimer = null, modeToken = null;

async function applyMode(name, mode, rate){
  const o = state.outputs.find(x=>x.name===name);
  if(o && o.mode === mode && Math.abs(Number(o.rate) - Number(rate)) < 0.05){
    toast(`${name} 已经是 ${mode} @ ${rate} Hz`);
    return;
  }
  busy = true;
  const r = await post('/api/modes/apply', {name, mode, rate});
  busy = false;
  if(!r.ok){
    toast('切换失败：' + (r.error || '未知错误'), true);
    refresh(false);
    return;
  }
  if(r.changed && r.token){
    startModeConfirm(r);
    toast(r.message || '模式已切换，请在倒计时内确认');
  }else{
    toast(r.message || '模式未变化');
  }
  refresh(false);
}

function startModeConfirm(r){
  endModeConfirm();
  modeToken = r.token;
  let left = Math.round(r.timeout || 15);
  const paint = ()=>{
    $('#modeBody').innerHTML = `${r.name} 已切到 <b>${r.applied.mode} @ ${r.applied.rate} Hz</b>`
      + `，<b>${left}</b> 秒内确认，否则自动退回 ${r.previous.mode} @ ${r.previous.rate} Hz`;
  };
  paint();
  $('#modeBar').classList.add('show');
  modeTimer = setInterval(()=>{
    left -= 1;
    if(left <= 0){
      endModeConfirm();
      toast('未确认，已自动退回上一个模式');
      refresh(false);
      return;
    }
    paint();
  }, 1000);
}

function endModeConfirm(){
  if(modeTimer){ clearInterval(modeTimer); modeTimer = null; }
  modeToken = null;
  $('#modeBar').classList.remove('show');
}

async function keepMode(){
  const t = modeToken;
  if(!t) return;
  endModeConfirm();
  const r = await post('/api/modes/confirm', {token: t});
  toast(r.ok ? (r.message || '已保持该模式') : ('确认失败：' + (r.error||'未知错误')), !r.ok);
  refresh(false);
}

async function undoMode(){
  const t = modeToken;
  endModeConfirm();
  const r = await post('/api/modes/revert', {token: t || ''});
  toast(r.ok ? (r.message || '已退回上一个模式') : ('撤销失败：' + (r.error||'未知错误')), !r.ok);
  refresh(false);
}

async function restoreLastMode(){
  const r = await post('/api/modes/revert', {});
  toast(r.ok ? (r.message || '已恢复上次可用模式') : ('恢复失败：' + (r.error||'未知错误')), !r.ok);
  refresh(false);
}

/* ---------------- 亮度滑杆 ---------------- */
const BRIGHT_THROTTLE_MS = 60;   // 拖动时最多每 60ms 提交一次，只发最新值，合并中间值

function buildBright(o){
  const b = state.brightness && state.brightness[o.name];
  if(!b) return null;
  const wrap = document.createElement('div');
  wrap.className = 'bright';
  wrap.dataset.out = o.name;

  const head = document.createElement('div');
  head.className = 'brightHead';
  const tagCls = b.mode === 'none' ? 'no' : (b.hardware ? 'hw' : 'sw');
  head.innerHTML = `<span>亮度</span><b class="bval">${b.value === null ? '-' : b.value + '%'}</b>`
                 + `<span class="btag ${tagCls}">${b.label || b.mode_label}</span>`;
  wrap.appendChild(head);

  const sl = document.createElement('input');
  sl.type = 'range'; sl.className = 'slider bmain';
  // 下限 20%：SDR 下再低等于黑屏（关掉 HDR 的 AOC 实测 0% 直接灰屏）。后端同样会拒绝。
  const vmin = Number(b.min_value) || 20;
  sl.min = vmin; sl.max = 100; sl.step = 1;
  sl.value = b.value === null ? 100 : Math.max(vmin, b.value);
  sl.disabled = !b.available;
  sl.title = b.available ? `拖动调节亮度（下限 ${vmin}%）`
                         : (b.reason || '这块屏不支持亮度调节');
  sl.oninput = () => {
    brightDragging = o.name;
    const v = Number(sl.value);
    brightDraft[o.name] = v;
    // 乐观更新：先让手柄和数字跟手，请求在后台按 60ms 合并发送
    head.querySelector('.bval').textContent = v + '%';
    queueBright(o.name, v);
  };
  sl.onchange = () => {
    brightDragging = null;
    if(brightTimer[o.name]){ clearTimeout(brightTimer[o.name]); brightTimer[o.name] = null; }
    const v = Number(sl.value);
    brightDraft[o.name] = v;
    // 松手：发最终值，后端做完整校验（硬件通道会读回；失败则界面回弹）
    sendBright(o.name, v, false);
  };
  sl.onclick = ev => ev.stopPropagation();
  wrap.appendChild(sl);

  if(b.available && b.floor_note){
    const fn = document.createElement('div');
    fn.className = 'bnote bfloor';
    fn.textContent = b.floor_note;
    wrap.appendChild(fn);
  }

  // 软件叠加：只在硬件通道出现。硬件没到下限时禁用（后端同样会拒绝），
  // 免得用户在还够暗的档位白白损失对比度。上限受合成亮度下限约束。
  if(b.hardware){
    const ovwrap = document.createElement('div');
    ovwrap.className = 'bov';
    const ovhead = document.createElement('div');
    ovhead.className = 'brightHead';
    const g0 = (b.gamma === null || b.gamma === undefined) ? '-' : Number(b.gamma).toFixed(2);
    ovhead.innerHTML = `<span>软件叠加</span><b class="bovval">${b.extra || 0}%</b>`
      + `<span class="bovtag">gamma ${g0}</span>`;
    ovwrap.appendChild(ovhead);

    const cap = Number(b.overlay_cap);
    const ov = document.createElement('input');
    ov.type = 'range'; ov.className = 'slider bovslider';
    ov.min = 0; ov.max = Number.isFinite(cap) ? Math.max(0, cap) : 100; ov.step = 1;
    ov.value = Math.min(b.extra || 0, ov.max);
    ov.disabled = !b.overlay_ready;
    ov.title = b.overlay_ready
      ? `硬件已到下限，继续用 gamma 压暗（最多 ${ov.max}%，再高整体会低于 10%）`
      : `先把上面的亮度拖到 ${vmin}% 才能叠加`;
    ov.oninput = () => {
      brightDragging = o.name;
      brightDraft[o.name + '#extra'] = Number(ov.value);
      ovhead.querySelector('.bovval').textContent = ov.value + '%';
      queueBrightExtra(o.name, Number(ov.value));
    };
    ov.onchange = () => {
      brightDragging = null;
      sendBrightExtra(o.name, Number(ov.value));
    };
    ov.onclick = ev => ev.stopPropagation();
    ovwrap.appendChild(ov);
    wrap.appendChild(ovwrap);
  }

  // 夜间色温：软件 gamma 的 R/G/B 比例，和亮度共用一次 xrandr 调用下发
  if(b.temp_ready){
    const tw = document.createElement('div');
    tw.className = 'btemp';
    const th = document.createElement('div');
    th.className = 'brightHead';
    th.innerHTML = `<span>夜间色温</span><b class="tempval">${tempText(b)}</b>`
      + `<span class="temptag${isWarm(b) ? ' warm' : ''}">${tempGammaText(b)}</span>`;
    tw.appendChild(th);

    const ts = document.createElement('input');
    ts.type = 'range'; ts.className = 'slider tempslider';
    ts.min = 3000; ts.max = 6500; ts.step = 100;
    ts.value = b.temp || 6500;
    ts.title = '往左更暖（数值越小越暖）；6500K = 原生不偏色';
    ts.oninput = () => {
      brightDragging = o.name;
      th.querySelector('.tempval').textContent = ts.value + 'K';
      queueTemp(o.name, Number(ts.value));
    };
    ts.onchange = () => {
      brightDragging = null;
      sendTemp(o.name, Number(ts.value));
    };
    ts.onclick = ev => ev.stopPropagation();
    tw.appendChild(ts);

    const row = document.createElement('div');
    row.className = 'temprow';
    const reset = document.createElement('button');
    reset.className = 'ghost';
    reset.textContent = '还原 6500K';
    reset.title = '色温还原成原生（gamma 1.00:1.00:1.00）';
    reset.onclick = ev => {
      ev.stopPropagation();
      ts.value = 6500;
      th.querySelector('.tempval').textContent = '6500K';
      sendTemp(o.name, 6500);
    };
    row.appendChild(reset);
    const hint = document.createElement('span');
    hint.className = 'meta';
    hint.textContent = '只改色偏，不降亮度';
    row.appendChild(hint);
    tw.appendChild(row);

    if(b.temp_note){
      const tn = document.createElement('div');
      tn.className = 'bnote tempdesc';
      tn.textContent = b.temp_note;
      tw.appendChild(tn);
    }
    if(b.night_light && b.night_light.enabled){
      const w = document.createElement('div');
      w.className = 'nlwarn';
      w.textContent = '注意：' + (b.night_light.note
        || 'GNOME 夜灯已开启，和这里改的是同一块 gamma 表，两者会互相覆盖');
      tw.appendChild(w);
    }
    wrap.appendChild(tw);
  }

  if(b.note){
    const n = document.createElement('div');
    n.className = 'bnote bdesc';
    n.textContent = b.note;
    wrap.appendChild(n);
  }
  if(b.reason){
    const r = document.createElement('div');
    r.className = 'berr berr-static';
    r.textContent = b.reason;
    wrap.appendChild(r);
  }
  if(b.hint && !b.available){
    const h = document.createElement('div');
    h.className = 'bnote';
    h.style.color = '#ffd28a';
    h.textContent = '需要权限：' + b.hint;
    wrap.appendChild(h);
  }
  if(b.hint && b.available){
    const d = document.createElement('details');
    d.className = 'bhint';
    const s = document.createElement('summary');
    s.textContent = '如何启用硬件通道';
    const pre = document.createElement('div');
    pre.className = 'bnote';
    pre.style.whiteSpace = 'pre-wrap';
    pre.textContent = b.hint;
    d.appendChild(s);
    d.appendChild(pre);
    wrap.appendChild(d);
  }
  if(brightErr[o.name]){
    const e = document.createElement('div');
    e.className = 'berr berr-js';
    e.textContent = brightErr[o.name];
    wrap.appendChild(e);
  }
  // 卡片本身有点击选中行为，滑杆区域不要触发
  wrap.onclick = ev => ev.stopPropagation();
  return wrap;
}

function queueBright(name, value){
  brightDraft[name] = value;
  // 和上次成功下发相同的值就不用再发；拖动中每 60ms 最多一拍，期间只保留最新值
  if(brightTimer[name] || brightLastSent[name] === value) return;
  brightTimer[name] = setTimeout(() => {
    brightTimer[name] = null;
    if(brightDragging !== name) return;    // 已松手，交给 onchange 的最终请求
    sendBright(name, brightDraft[name], true);
  }, BRIGHT_THROTTLE_MS);
}

function queueBrightExtra(name, value){
  const key = name + '#extra';
  brightDraft[key] = value;
  if(brightTimer[key]) return;
  brightTimer[key] = setTimeout(() => {
    brightTimer[key] = null;
    sendBrightExtra(name, brightDraft[key]);
  }, BRIGHT_THROTTLE_MS);
}

// ---- 夜间色温 ----
function isWarm(b){ return !!(b && b.temp && b.temp !== 6500); }
function tempText(b){ return isWarm(b) ? b.temp + 'K' : '6500K'; }
function tempGammaText(b){
  if(!isWarm(b)) return '原生';
  const g = b.temp_gamma || [1, 1, 1];
  return 'gamma ' + g.map(v => Number(v).toFixed(2)).join(':');
}

function queueTemp(name, value){
  const key = name + '#temp';
  brightDraft[key] = value;
  if(brightTimer[key]) return;
  brightTimer[key] = setTimeout(() => {
    brightTimer[key] = null;
    sendTemp(name, brightDraft[key]);
  }, BRIGHT_THROTTLE_MS);
}

async function sendTemp(name, value){
  const key = name + '#temp';
  const seq = (brightSeq[key] = (brightSeq[key] || 0) + 1);
  try{
    const r = await post('/api/brightness', {name, temp: value});
    if(seq !== brightSeq[key]) return;
    if(!r.ok) throw new Error(r.error || '设置失败');
    if(state && state.brightness && r.brightness) state.brightness[name] = r.brightness;
    delete brightErr[name];
  }catch(e){
    if(seq !== brightSeq[key]) return;
    brightErr[name] = e.message;
    toast(`色温设置失败：${e.message}`, true);
  }
  updateBrightText(name);
}

async function sendBright(name, value, live){
  const seq = (brightSeq[name] = (brightSeq[name] || 0) + 1);
  try{
    const r = await post('/api/brightness', {name, value, live: !!live});
    if(seq !== brightSeq[name]) return;          // 已有更新的请求，丢弃旧结果
    if(!r.ok) throw new Error(r.error || '设置失败');
    if(state && state.brightness && r.brightness) state.brightness[name] = r.brightness;
    brightLastSent[name] = value;
    delete brightErr[name];
  }catch(e){
    if(seq !== brightSeq[name]) return;
    if(live){
      // 拖动中的偶发失败先不打扰用户，松手的最终请求会再完整校验一次
      return;
    }
    // 最终值被拒（例如低于 20）：拉回后端真实值，界面回弹到实际值
    brightErr[name] = e.message;
    let actual = null;
    try{
      const r2 = await fetch('/api/brightness', {cache:'no-store'}).then(x=>x.json());
      if(r2 && r2.ok && r2.brightness && r2.brightness[name]) actual = r2.brightness[name];
    }catch(_){ }
    if(actual && state && state.brightness) state.brightness[name] = actual;
    const shown = (state && state.brightness && state.brightness[name])
      ? state.brightness[name].value : null;
    toast(`亮度设置失败：${e.message}` + (shown !== null ? `（已回到 ${shown}%）` : ''), true);
  }
  updateBrightText(name);
}

async function sendBrightExtra(name, value){
  const key = name + '#extra';
  const seq = (brightSeq[key] = (brightSeq[key] || 0) + 1);
  try{
    const r = await post('/api/brightness', {name, extra: value});
    if(seq !== brightSeq[key]) return;
    if(!r.ok) throw new Error(r.error || '设置失败');
    if(state && state.brightness && r.brightness) state.brightness[name] = r.brightness;
    delete brightErr[name];
  }catch(e){
    if(seq !== brightSeq[key]) return;
    brightErr[name] = e.message;
    toast(`软件叠加设置失败：${e.message}`, true);
  }
  updateBrightText(name);
}

// 亮度区动态字段统一在这里刷新：主值、通道标签（纯硬件 / 叠加 / 纯软件）、
// 叠加滑杆可用性与 gamma、说明文字。不走整卡重建，拖动时手柄不会跳。
function paintBright(wrap, b){
  if(!b) return;
  // 拖动中只让本地乐观值说话，别让在途响应的旧值把手柄/数字拽回去
  const dragging = brightDragging === wrap.dataset.out;
  const val = wrap.querySelector('.bval');
  if(val && !dragging) val.textContent = b.value === null ? '-' : b.value + '%';
  const tag = wrap.querySelector('.btag');
  if(tag){
    tag.textContent = b.label || b.mode_label;
    tag.className = 'btag ' + (b.mode === 'none' ? 'no' : (b.hardware ? 'hw' : 'sw'));
  }
  const sl = wrap.querySelector('.bmain');
  if(sl){
    const vmin = Number(b.min_value) || 20;
    sl.min = vmin;
    if(!dragging && b.value !== null && Number(sl.value) !== Math.max(vmin, b.value))
      sl.value = Math.max(vmin, b.value);
  }
  const ov = wrap.querySelector('.bovslider');
  if(ov){
    const cap = Number(b.overlay_cap);
    if(Number.isFinite(cap)) ov.max = Math.max(0, cap);
    ov.disabled = !b.overlay_ready;
    const want = Math.min(b.extra || 0, ov.max);
    if(Number(ov.value) !== Number(want)) ov.value = want;
    ov.title = b.overlay_ready
      ? `硬件已到下限，继续用 gamma 压暗（最多 ${ov.max}%，再高整体会低于 10%）`
      : `先把上面的亮度拖到 ${Number(b.min_value) || 20}% 才能叠加`;
    const ovv = wrap.querySelector('.bovval');
    if(ovv) ovv.textContent = (b.extra || 0) + '%';
    const ovt = wrap.querySelector('.bovtag');
    if(ovt) ovt.textContent = 'gamma ' + (b.gamma === null || b.gamma === undefined
      ? '-' : Number(b.gamma).toFixed(2));
  }
  const fdesc = wrap.querySelector('.bfloor');
  if(fdesc) fdesc.textContent = b.floor_note || '';
  const desc = wrap.querySelector('.bdesc');
  if(desc) desc.textContent = b.note || '';
  // 夜间色温区
  const tv = wrap.querySelector('.tempval');
  if(tv) tv.textContent = tempText(b);
  const ts = wrap.querySelector('.tempslider');
  if(ts){
    ts.disabled = !b.temp_ready;
    if(Number(ts.value) !== Number(b.temp || 6500)) ts.value = b.temp || 6500;
  }
  const tt = wrap.querySelector('.temptag');
  if(tt){
    tt.textContent = tempGammaText(b);
    tt.className = 'temptag' + (isWarm(b) ? ' warm' : '');
  }
  const td = wrap.querySelector('.tempdesc');
  if(td) td.textContent = b.temp_note || '';
}

function updateBrightText(name){
  const wrap = document.querySelector(`.bright[data-out="${name}"]`);
  if(!wrap) return;
  paintBright(wrap, state && state.brightness && state.brightness[name]);
  wrap.querySelectorAll('.berr-js').forEach(el => el.remove());
  if(brightErr[name]){
    const e = document.createElement('div');
    e.className = 'berr berr-js';
    e.textContent = brightErr[name];
    wrap.appendChild(e);
  }
}

// 轮询回来的值回写到滑杆；拖动中不回写，避免手柄跳
function syncBrightSliders(){
  if(!state || !state.brightness) return;
  document.querySelectorAll('.bright').forEach(wrap => {
    const name = wrap.dataset.out;
    if(brightDragging === name) return;
    const b = state.brightness[name];
    if(!b) return;
    const sl = wrap.querySelector('.bmain');
    if(sl && !sl.disabled && b.value !== null) sl.value = b.value;
    paintBright(wrap, b);
  });
}

/* ---------------- 操作 ---------------- */
// 尽力判断某块屏是不是「浏览器窗口所在屏」（X11 下 window.screenX 是屏幕坐标）
function isBrowserScreen(o){
  const dpr = window.devicePixelRatio || 1;
  const pts = [
    [window.screenX, window.screenY],
    [window.screenX*dpr, window.screenY*dpr],
  ];
  return pts.some(([x,y]) =>
    x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
}

async function doOff(name){
  const o = state.outputs.find(x=>x.name===name);
  if(!o) return;
  if(state.enabled_count <= 1){
    toast('拒绝关闭：这是当前唯一启用的输出，关掉后将没有任何画面', true);
    return;
  }
  const rest = state.outputs.filter(x=>x.enabled && x.name!==name);
  const c = rest.length ? {
    w: Math.max(...rest.map(x=>x.x+x.w)) - Math.min(...rest.map(x=>x.x)),
    h: Math.max(...rest.map(x=>x.y+x.h)) - Math.min(...rest.map(x=>x.y)),
  } : {w:0,h:0};

  const rows = [
    ['要关闭', `${name}${o.panel?'（内屏）':''}`],
    ['关闭后剩余', `${rest.length} 块：${rest.map(x=>x.name).join(', ') || '无'}`],
    ['画布尺寸', `${fmtCanvas(state.canvas)} → ${rest.length ? fmtCanvas(c) : '无（会拒绝）'}`],
  ];
  if(o.idle) rows.splice(1, 0, ['关闭原因', `画面已 ${fmtDur(o.idle_seconds)} 无变化（${o.idle_basis}）`]);
  $('#mRows').innerHTML = rows.map(([k,v])=>
    `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const selfScreen = isBrowserScreen(o);
  const warns = [];
  if(o.panel){
    warns.push(`这是笔记本内屏（${name}），关掉后笔记本自带面板会黑屏；` +
               `画面会留在剩下的 ${rest.length} 块屏上（${rest.map(x=>x.name).join(', ') || '无'}）。`);
  }
  if(selfScreen) warns.push('这个界面正好在这块屏上，关掉后界面会从眼前消失；需要时按 Ctrl+Alt+Shift+F12 恢复全部，或用命令行重新开启。');
  if(o.primary) warns.push('这是 primary 屏，关闭后 primary 会转移到别的屏。');
  $('#mWarn').innerHTML = warns.length
    ? `<div class="dangerBox">⚠ ${warns.join('<br>⚠ ')}</div>` : '';

  dialogOpen = true;
  $('#mask').classList.add('show');
  const ok = await new Promise(res=>{
    $('#mOk').onclick = ()=>{ close(); res(true); };
    $('#mCancel').onclick = ()=>{ close(); res(false); };
    $('#mask').onclick = ev=>{ if(ev.target.id==='mask'){ close(); res(false); } };
    function close(){ dialogOpen = false; $('#mask').classList.remove('show'); }
  });
  if(!ok) return;

  busy = true;
  const r = await post('/api/off', {name});
  busy = false;
  if(r.ok){
    toast(r.message || `已关闭 ${name}`);
    if(r.state){ state = r.state; render(); }
  }else{
    toast('关闭失败：' + (r.error||'未知错误'), true);
  }
  refresh(false);
}

async function doOn(name){
  busy = true;
  const r = await post('/api/on', {name});
  busy = false;
  if(r.ok){
    toast((r.message||`已开启 ${name}`) + (r.geometry ? `（${r.geometry}）` : '') +
          (r.warning ? ' ｜ 注意: ' + r.warning : ''));
    if(r.state){ state = r.state; render(); }
  }else{
    toast('开启失败：' + (r.error||'未知错误'), true);
  }
  refresh(false);
}

async function doRestoreAll(){
  busy = true;
  const r = await post('/api/restore', {});
  busy = false;
  toast(r.message || (r.ok?'已恢复':'恢复失败'), !r.ok);
  if(r.state){ state = r.state; render(); }
  refresh(false);
}

/* 关屏就是关屏：不再有定时自动开回，只有用户点「开启」或按恢复全部才会再亮 */
async function showLog(){
  const box = $('#logBox');
  box.classList.toggle('show');
  if(!box.classList.contains('show')) return;
  const j = await (await fetch('/api/log')).json();
  box.textContent = (j.lines||[]).join('\n') || '(暂无日志)';
}

/* ---------------- 事件 ---------------- */
$('#btnRefresh').onclick = ()=> refresh(true);
$('#btnRestore').onclick = ()=> doRestoreAll();
$('#btnLog').onclick = showLog;
$('#modeKeep').onclick = ()=> keepMode();
$('#modeUndo').onclick = ()=> undoMode();
$('#thresholdSel').onchange = async e=>{
  const v = Number(e.target.value);
  const r = await post('/api/config', {idle_threshold: v});
  if(r.ok){
    toast(v === 0 ? '已关闭闲置提醒' : `闲置阈值已设为 ${v < 60 ? v+' 秒' : (v/60)+' 分钟'}`);
    refresh(false);
  }else{
    toast('保存失败：' + (r.error||'未知错误'), true);
  }
};

// 自动更新：每 2 秒拉一次状态；关闭弹窗/操作进行中/确认窗期间暂停，避免打架
setInterval(()=>{
  if(!dialogOpen && !busy && !modeTimer) refresh(false);
}, POLL_MS);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !dialogOpen && !busy && !modeTimer) refresh(false);
});

buildBreakPanel();
refresh(false);
</script>
