# 安装到 /etc/systemd/system/usbnicd.service.d/10-screen-session.conf（需要 sudo）
#
# 目的：让 8787 的 usbnicd（系统级、root）在「最后一个用户会话结束」时随
# user@1000.service 一起停止，并由 root 权限做与官方 host-stop.sh 等价的清理。
# 不修改 usb_wireless_network 仓库里的任何业务代码，只替换托管方式。
[Unit]
# user@1000.service 由系统管理器（logind 在最后一个会话结束时）停止，
# PartOf 会把 stop 传播到本服务。需要在同一 manager（系统级）里，因此只能用 drop-in。
# 若 loginctl show-user <user> -p Linger 为 yes，user@ 不会停，这段就不生效。
PartOf=user@1000.service

[Service]
# 与官方 scripts/host-stop.sh 的清理动作一致：nftables 表、策略路由、
# 由上位机开启的 TUN / TPROXY。停服务时以 root 执行（WorkingDirectory 已由主 unit 指定）。
ExecStop=/usr/bin/python3 -m usbnic_host.cleanup --config /home/xzh-wuyan/eric/wuyan_github/usb_wireless_network/host/config/host.yaml --proxy
